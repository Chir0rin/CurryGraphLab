<title>Curry Graph Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f4ee; --panel:#fffdf8; --ink:#1f2430; --muted:#6b7280; --line:#e2ddd2;
  --accent:#c98a12; --accent-ink:#5a3d00; --accent-soft:#fbf1d8;
  --done:#4f8a63; --done-soft:#e3efe6; --pending:#a9b0bd; --fail:#b5432d; --fail-soft:#f8e2dc;
  --gate:#3b6ea5; --gate-soft:#e0eaf6; --code-bg:#f1eee6;
  --radius:8px; --mono:"IBM Plex Mono","BIZ UDGothic",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"BIZ UDPGothic","Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181f; --panel:#1c2029; --ink:#e8e6df; --muted:#9aa1ad; --line:#2d323d;
    --accent:#e0a63a; --accent-ink:#ffe1a6; --accent-soft:#3a2f14;
    --done:#7fbf93; --done-soft:#1f3327; --pending:#5c6472; --fail:#e0705a; --fail-soft:#3f221c;
    --gate:#7aa6d9; --gate-soft:#1e2c3d; --code-bg:#121419;
  }
}
:root[data-theme="dark"]{
  --bg:#15181f; --panel:#1c2029; --ink:#e8e6df; --muted:#9aa1ad; --line:#2d323d;
  --accent:#e0a63a; --accent-ink:#ffe1a6; --accent-soft:#3a2f14;
  --done:#7fbf93; --done-soft:#1f3327; --pending:#5c6472; --fail:#e0705a; --fail-soft:#3f221c;
  --gate:#7aa6d9; --gate-soft:#1e2c3d; --code-bg:#121419;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;padding:0 16px;padding-block:24px 48px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1{font-size:1.6rem;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:.82rem;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:24px}
header{display:grid;grid-template-columns:1fr auto;gap:16px 24px;align-items:start}
header p{color:var(--muted);max-width:64ch;margin-top:8px}
.purpose{margin-top:8px;padding:16px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;background:var(--panel);max-width:72ch}
.purpose b{display:block;margin-bottom:8px}
.purpose ol{margin:0;padding-left:24px;display:grid;gap:8px}
.purpose li{line-height:1.5}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.lang button{border:0;border-radius:0;padding:8px 16px;font-size:.85rem}
.lang button.on{background:var(--ink);color:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.8rem;color:var(--muted);grid-column:1/-1}
.legend i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:8px;border:2px solid}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px 16px}
button{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 16px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gate);outline-offset:2px}
.sep{width:1px;height:24px;background:var(--line);margin:0 8px}
label.opt{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink)}
input[type=number],select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);color:var(--ink);width:64px}
select{width:auto}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px}
.grid3{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:1180px){.grid3{grid-template-columns:1fr 1fr}.grid3>.graph{grid-column:1/-1}}
@media (max-width:720px){.grid3{grid-template-columns:1fr}}
#gate .gatebox{border-width:2px;padding:16px 24px}
#gate .gatebox b{font-size:1.05rem}
@media (max-width:900px){.grid{grid-template-columns:1fr}header{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.graph{overflow-x:auto}
svg{display:block;width:100%;height:auto;max-width:100%;font-family:var(--sans)}
.node{cursor:pointer}
.node rect{fill:var(--panel);stroke:var(--pending);stroke-width:1.5;rx:8}
.node text{fill:var(--ink);font-size:12.5px;font-weight:700}
.node.frontier rect{stroke:var(--accent);stroke-width:2.5;fill:var(--accent-soft)}
.node.done rect{stroke:var(--done);fill:var(--done-soft)}
.node.failed rect{stroke:var(--fail);stroke-width:2.5;fill:var(--fail-soft)}
.node.retried rect{stroke:var(--fail);stroke-width:2.5;stroke-dasharray:4 3}
.node.interrupt rect{stroke:var(--gate);stroke-width:2.5;stroke-dasharray:5 3;fill:var(--gate-soft)}
.node.selected rect{stroke-width:3.5}
.edge{stroke:var(--pending);stroke-width:1.5;fill:none;marker-end:url(#arr)}
.edge.cond{stroke-dasharray:6 4}
.edge.active{stroke:var(--accent);stroke-width:2.5;marker-end:url(#arr-active)}
.edge.taken{stroke:var(--done);marker-end:url(#arr-done)}
.badge{font-size:10px;fill:var(--muted);font-family:var(--mono)}
.elabel{font-size:10.5px;fill:var(--gate);font-weight:700}
.elabel-bg{fill:var(--panel)}
.schema{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:0 0 16px;font-size:.82rem}
.schema>div{display:flex;flex-direction:column;justify-content:center;border-radius:8px;padding:8px 16px;line-height:1.4}
.schema small{color:var(--muted);font-size:.72rem}
.sc-node{border:1.5px solid var(--pending);background:var(--panel);min-width:80px}
.sc-edge{position:relative;padding-right:24px!important;color:var(--muted)}
.sc-edge i{position:absolute;right:0;top:50%;width:16px;height:0;border-top:1.5px solid var(--pending)}
.sc-edge i::after{content:"";position:absolute;right:-2px;top:-4px;border:4px solid transparent;border-left:6px solid var(--pending)}
.sc-state{border:1.5px dashed var(--gate);background:var(--gate-soft);flex:1;min-width:220px}
.nodeinfo{margin-top:16px;border-left:4px solid var(--gate);background:var(--gate-soft);padding:16px;border-radius:0 8px 8px 0;font-size:.88rem;display:grid;gap:8px}
.nodeinfo code{font-family:var(--mono);font-size:.8rem;background:var(--panel);padding:0 4px;border-radius:4px}
.now{display:grid;gap:8px;border-left:4px solid var(--accent);padding:16px;background:var(--accent-soft);border-radius:0 8px 8px 0}
.now .step{font-family:var(--mono);font-size:.8rem;color:var(--accent-ink)}
.now .what{font-weight:700}
.now .why{color:var(--muted);font-size:.95rem}
.concepts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{font-size:.78rem;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.chip.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:.78rem;letter-spacing:.04em}
td.k{white-space:normal;min-width:120px}
td.k small{display:block;color:var(--muted);font-family:var(--mono);font-size:.7rem}
td.v{font-family:var(--mono);word-break:break-all}
tr.changed td{background:var(--accent-soft)}
tr.changed td.v::after{content:" ←";color:var(--accent-ink)}
.red{display:inline-block;font-size:.68rem;padding:0 8px;border-radius:999px;background:var(--gate-soft);color:var(--gate);margin-left:8px}
.front{font-size:.85rem;display:flex;flex-wrap:wrap;gap:8px}
.front span{padding:4px 8px;border-radius:8px;background:var(--code-bg);border:1px solid var(--line)}
.front span.wait{border-style:dashed;color:var(--muted)}
.log{font-family:var(--mono);font-size:.8rem;max-height:264px;overflow:auto;background:var(--code-bg);border-radius:8px;padding:16px;display:grid;gap:4px}
.log .l{display:grid;grid-template-columns:40px 1fr;gap:8px}
.log .n{color:var(--muted)}
.log .fail{color:var(--fail)}
.log .gate{color:var(--gate)}
.log .ok{color:var(--done)}
.gatebox{display:grid;gap:8px;border:1px dashed var(--gate);border-radius:8px;padding:16px;background:var(--gate-soft)}
.gatebox .row{align-items:center}
.gatebox .row input[type=text]{flex:1;min-width:200px;width:auto}
.gatebox input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);color:var(--ink);width:100%}
.gatebox .row{display:flex;gap:8px;flex-wrap:wrap}
.gatebox small{color:var(--muted)}
details{border:1px solid var(--line);border-radius:8px;padding:8px 16px;background:var(--panel)}
summary{cursor:pointer;font-weight:500}
pre{font-family:var(--mono);font-size:.75rem;background:var(--code-bg);padding:16px;border-radius:8px;overflow-x:auto;margin:8px 0 0}
.glossary{display:grid;grid-template-columns:repeat(auto-fit,minmax(264px,1fr));gap:16px}
.glossary div{border-top:2px solid var(--line);padding-top:8px}
.glossary b{display:block;margin-bottom:8px}
.glossary p{color:var(--muted);font-size:.93rem}
@media (prefers-reduced-motion:no-preference){.node rect,.edge{transition:stroke .25s,fill .25s}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Curry Graph Lab</h1>
      <div class="purpose"><b data-t="purposeTitle"></b><ol id="purpose"></ol></div>
      <p data-t="intro"></p>
    </div>
    <div class="lang" role="group" aria-label="language"><button id="langJa">日本語</button><button id="langEn">English</button></div>
    <div class="legend" id="legend"></div>
  </header>

  <div class="toolbar">
    <button class="primary" id="btnStep"></button>
    <button id="btnAuto"></button>
    <button id="btnReset"></button>
    <span class="sep"></span>
    <label class="opt"><input type="checkbox" id="optParallel" checked> <span data-t="optParallel"></span></label>
    <label class="opt"><input type="checkbox" id="optInterruptRoux" checked> <span data-t="optIntRoux"></span></label>
    <label class="opt"><input type="checkbox" id="optInterruptTaste"> <span data-t="optIntTaste"></span></label>
    <span class="sep"></span>
    <label class="opt"><span data-t="optFail"></span> <select id="optFailNode"><option value="" data-t="none"></option><option value="cook_rice">cook_rice</option><option value="simmer">simmer</option><option value="add_salt">add_salt</option></select></label>
    <label class="opt"><span data-t="optFailTimes"></span> <input type="number" id="optFailTimes" value="3" min="1" max="9"></label>
    <label class="opt"><span data-t="optRetries"></span> <input type="number" id="optRetries" value="2" min="0" max="9"></label>
  </div>
  <div id="gate" hidden></div>

  <div class="grid3">
    <div class="panel graph">
      <h2 data-t="hGraph"></h2>
      <div class="schema">
        <div class="sc-node"><span data-t="scNode"></span><small data-t="scNodeSub"></small></div>
        <div class="sc-edge"><span data-t="scEdge"></span><small data-t="scEdgeSub"></small><i></i></div>
        <div class="sc-node"><span data-t="scNode"></span><small data-t="scNodeSub"></small></div>
        <div class="sc-state"><span data-t="scState"></span><small data-t="scStateSub"></small></div>
      </div>
      <svg id="svg" viewBox="0 0 760 470" role="img" aria-label="graph">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9b0bd"/></marker>
          <marker id="arr-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98a12"/></marker>
          <marker id="arr-done" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f8a63"/></marker>
        </defs>
        <g id="edges"></g>
        <g id="nodes"></g>
      </svg>
      <div id="nodeinfo" class="nodeinfo" hidden></div>
      <div class="legend" id="edgeLegend" style="margin-top:16px"></div>
    </div>

    <div class="panel" style="display:grid;gap:16px;align-content:start">
      <div>
        <h2 data-t="hNow"></h2>
        <div class="now" id="now"></div>
        <div class="concepts" id="concepts"></div>
      </div>
      <div>
        <h2 data-t="hFrontier"></h2>
        <div class="front" id="frontier"></div>
      </div>
    </div>
    <div class="panel">
      <h2 data-t="hState"></h2>
      <div style="overflow-x:auto"><table><thead><tr><th data-t="thKey"></th><th data-t="thVal"></th></tr></thead><tbody id="state"></tbody></table></div>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2 data-t="hLog"></h2>
      <div class="log" id="log"></div>
    </div>
    <div class="panel">
      <h2 data-t="hCkpt"></h2>
      <details><summary data-t="ckptOpen"></summary><pre id="ckpt">{}</pre></details>
      <p style="color:var(--muted);font-size:.9rem;margin-top:16px" data-t="ckptNote"></p>
    </div>
  </div>

  <div class="panel">
    <h2 data-t="hGloss"></h2>
    <div class="glossary" id="glossary"></div>
  </div>
</div>

<script>
// ============================================================ i18n
const T = {
ja: {
  purposeTitle:'このツールの目的',
  purpose:['AI や自動化の裏側で使われる「状態グラフ」という仕組みを、実際に動かして直感で理解する。','専門用語(ノード・エッジ・ステート・Reducer・interrupt など)を、日常の言葉と 1 対 1 で結びつける。','「途中で止める」「やり直す」「記録を残す」という、本番運用で効いてくる 3 つの要点を体験する。'],
  intro:'カレー作りの手順を「工程のつながり(グラフ)」として書き、それを 1 手番ずつ動かして観察するページ。左の図で「次にどの工程ができるか」、右の表で「材料や鍋の状態がどう変わったか」、解説で「いま何が起きたか」を追う。専門用語は括弧の中に添えてある。',
  legend:[['frontier','次にできる工程(frontier)'],['done','完了'],['interrupt','人に聞くため停止(interrupt)'],['failed','失敗して停止'],['retried','失敗したがやり直しで成功']],

  optFail:'わざと失敗させる工程', none:'なし', optFailTimes:'失敗する回数', optRetries:'やり直し上限',
  hGraph:'工程のつながり(グラフ)', scNode:'工程', scNodeSub:'ノード', scEdge:'次に進む道', scEdgeSub:'エッジ',
  scState:'共有の記録ノート', scStateSub:'ステート(右の表)。全ての工程が読み書きする 1 冊。工程をクリックすると、その工程が読む欄と書く欄が出る',
  edgeLegend:['実線 = 必ず次へ進む矢印(固定エッジ)','破線 = 様子を見て行き先を決める分かれ道(条件エッジ)','自分に戻る矢印 = 同じ工程を繰り返す(サイクル)','2 本が 1 つに合流 = 両方が終わるのを待つ(ファンイン)'],
  hNow:'いま起きていること', hFrontier:'次にできる工程(frontier)', hState:'いまの状態(State: 材料・鍋・味の記録)', thKey:'記録欄', thVal:'値',
  hLog:'実行ログ', hCkpt:'セーブ地点(チェックポイント: 毎手番の後に保存される記録)', ckptOpen:'最新のセーブ地点を見る',

  hGloss:'用語(日常の言葉で)',
  gloss:[['手番(スーパーステップ)','「いまできる工程」をまとめて 1 回動かす単位。ご飯と漬物のように同時にできる工程は同じ手番で進み、結果はまとめて記録される。'],
    ['合流のルール(Reducer)','2 つの工程が同じ記録欄に同時に書いた時、どう合わせるかの決まり。「付け合わせ」欄は「追記」なので、ご飯と漬物の両方が残る。決まりが「上書き」だと片方が消える。'],
    ['分かれ道と繰り返し(条件エッジ・サイクル)','工程が終わった後の状態を見て次を決める矢印。「まだ固いならもう一度煮る」のように自分に戻せば繰り返しになる。やめる条件は回数ではなく状態(柔らかさ・塩の量)で決める。'],

    ['セーブ地点(チェックポイント)','毎手番の後に「どこまで進んだか」と「いまの状態」を保存する。途中で止まっても、保存した所から続きができる。'],
    ['人に聞く停止(interrupt)','決めた工程の直前で止まり、人の返事を待つ。返事は記録に残る(human_note)。止める場所を増やすほど、人が答える回数が増える。'],
    ['やり直しと手動介入(再試行)','工程が失敗したら決めた回数までやり直す。それでも駄目なら、進み具合を保ったまま止まって人を待つ。直した後は最初からではなく続きから。']],
  chips:['手番','合流のルール','分かれ道','繰り返し','手分け','合流','セーブ地点','人に聞く停止','やり直し'],

  failWhat:n=>`✖ 「${n}」がやり直し上限に達した`, failWhy:'進み具合を保ったまま停止。直して「再開」を押すと、最初からではなくこの手番から続く。',
  repairTitle:n=>`✖ 人の手直し待ち(「${n}」)`, repairSub:'直したら再開。セーブ地点から続きなので、同時に成功した工程の結果は失われない。', repair:'直して再開',

  shop_buy_missing: ['peel_vegetables'], peel_vegetables: ['cut_vegetables'], cut_vegetables: ['saute_meat'],
  saute_meat: ['saute_vegetables'], saute_vegetables: ['add_water'], add_water: ['simmer'],

  add_roux: ['taste_check'],
  taste_check: s => s.taste_result === '薄い' ? ['add_salt'] : ['cook_rice','prepare_pickles'],

};

};
const START = 'shop_check';
const POS = { shop_check:[70,60], shop_buy_missing:[70,150], peel_vegetables:[230,60], cut_vegetables:[380,60], saute_meat:[530,60], saute_vegetables:[680,60],
  add_water:[680,160], simmer:[530,160], add_roux:[380,160], taste_check:[230,160], add_salt:[230,260],

// ============================================================ engine
let S, selectedNode = null, lastNote = null;
const concepts = new Set();
function initial() {
  return { step: 0, frontier: new Set([START]), done: new Set(), state: { ingredients: ['人参','じゃがいも','豚肉'], cut_style: '一口大', salt_g: 0, revision_count: 0, taste_history: [], sides_ready: [], errors: [] },
    changed: new Set(), paused: null, failLeft: {}, halted: false, lastEdges: [], takenEdges: [], failedNodes: new Set(), retriedNodes: new Set(), finished: false, approvedOnce: false };

function opts() {

function apply(state, updates) {

    case 'cond': what = tt.condWhat(L(args.node), args.next.map(L).join('」「')); why = tt.condWhy; break;

const LOG = [];
function log(text, cls = '') { LOG.push([S.step, text, cls]); }
function renderLog() { const l = document.getElementById('log'); l.innerHTML = LOG.map(([s, x, c]) => `<div class="l"><span class="n">${String(s).padStart(2, '0')}</span><span class="${c}">${x}</span></div>`).join(''); l.scrollTop = l.scrollHeight; }

function stepOnce() {
  if (S.finished || S.halted || S.paused) return;
  const o = opts();
  const stop = [...S.frontier].filter(n => o.interrupts.has(n));
  if (stop.length && !S.approvedOnce) { S.paused = stop; note('interrupt', { nodes: stop }, [t().chips[7], t().chips[6]]); log(`⏸ interrupt before ${stop.join(', ')}: waiting for human`, 'gate'); render(); return; }
  S.approvedOnce = false;

  if (!o.parallel && ready.length > 1) ready = [ready[0]];
  const updates = [], failed = [], retried = []; const tags = []; S.retriedNodes = new Set(); S.lastEdges = [];
  const c = t().chips; // [turn, merge, fork, repeat, split, join, save, ask, retry]

    let ok = false;

      updates.push(NODE_FN[n](S.state)); ok = true; if (attempt > 0) { retried.push([n, attempt, o.retries]); S.retriedNodes.add(n); } break;

  ready.forEach(n => S.done.add(n));

  else if (waiting.length) { tags.push(c[5]); note('join', { ready, waiting, deps: JOIN[waiting[0]] || [], retried }, tags); }
  else if (ready.length === 1 && S.lastEdges.some(([a, b]) => a === b)) note('cyc', { node: ready[0], soft: S.state.potato_softness, retried }, tags);
  else if (ready.length === 1 && COND.has(ready[0])) note('cond', { node: ready[0], next: [...next], retried }, tags);
  else note('fix', { ready, next: [...next], changed: [...S.changed], retried }, tags);
  log(`${ready.join(', ')} → ${[...next].join(', ') || 'END'}${merged.length ? ' · reducer merge: ' + merged.join(', ') : ''}`, S.finished ? 'ok' : '');
  render();
}

// ============================================================ rendering
function renderGraph() {
  const tt = t(); const g = document.getElementById('nodes'), eg = document.getElementById('edges'); g.innerHTML = ''; eg.innerHTML = '';
  const takenKey = new Set(S.takenEdges.map(e => e.join('>'))); const lastKey = new Set(S.lastEdges.map(e => e.join('>')));
  for (const [from, e] of Object.entries(EDGES)) {
    const targets = typeof e === 'function' ? COND_TARGETS[from] : e;
    for (const to of targets) {
      const [x1, y1] = POS[from], [x2, y2] = POS[to]; let d, lx, ly;
      if (from === to) { d = `M${x1 + W / 2},${y1 - 8} c 30,-40 -110,-40 -${W / 2 + 4},-6`; lx = x1 - 10; ly = y1 - 44; }
      else { const dx = x2 - x1, dy = y2 - y1, horiz = Math.abs(dx) > Math.abs(dy); const sx = x1 + (horiz ? Math.sign(dx) * W / 2 : 0), sy = y1 + (horiz ? 0 : Math.sign(dy) * H / 2); const tx = x2 - (horiz ? Math.sign(dx) * (W / 2 + 2) : 0), ty = y2 - (horiz ? 0 : Math.sign(dy) * (H / 2 + 2)); d = `M${sx},${sy} L${tx},${ty}`; lx = (x1 + x2) / 2; ly = (y1 + y2) / 2 - 6; if (from === 'taste_check' && to !== 'add_salt') ly += (to === 'cook_rice' ? -14 : 8); }
      const k = from + '>' + to;
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d);
      p.setAttribute('class', 'edge' + (COND.has(from) ? ' cond' : '') + (lastKey.has(k) ? ' active' : takenKey.has(k) ? ' taken' : '')); eg.appendChild(p);
      if (tt.edge[k]) {
        const text = tt.edge[k]; const w = text.length * (lang === 'ja' ? 10 : 6) + 8;
        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect'); bg.setAttribute('class', 'elabel-bg'); bg.setAttribute('x', lx - w / 2); bg.setAttribute('y', ly - 10); bg.setAttribute('width', w); bg.setAttribute('height', 13); bg.setAttribute('rx', 3); eg.appendChild(bg);
        const tx = document.createElementNS('http://www.w3.org/2000/svg', 'text'); tx.setAttribute('class', 'elabel'); tx.setAttribute('x', lx); tx.setAttribute('y', ly); tx.setAttribute('text-anchor', 'middle'); tx.textContent = text; eg.appendChild(tx);
      }
    }
  }
  for (const [n, [x, y]] of Object.entries(POS)) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    let cls = 'node' + (selectedNode === n ? ' selected' : ''); if (S.failedNodes.has(n)) cls += ' failed'; else if (S.retriedNodes.has(n)) cls += ' retried'; else if (S.paused && S.paused.includes(n)) cls += ' interrupt'; else if (S.frontier.has(n)) cls += ' frontier'; else if (S.done.has(n)) cls += ' done';
    el.setAttribute('class', cls);
    el.innerHTML = `<rect x="${x - W / 2}" y="${y - H / 2}" width="${W}" height="${H}"/><text x="${x}" y="${y + 4}" text-anchor="middle">${L(n)}</text><text class="badge" x="${x}" y="${y + H / 2 + 12}" text-anchor="middle">${n}${JOIN[n] ? ' · join' : ''}${opts().interrupts.has(n) ? ' · interrupt' : ''}</text>`;
    el.addEventListener('click', () => { selectedNode = selectedNode === n ? null : n; render(); });
    g.appendChild(el);
  }
}
function renderNodeInfo() {
  const box = document.getElementById('nodeinfo'); const tt = t();
  if (!selectedNode) { box.hidden = true; return; }
  const [reads, writes] = RW[selectedNode]; const f = k => `<code>${tt.key[k] || k}</code>`;
  const outs = COND.has(selectedNode) ? COND_TARGETS[selectedNode].map(x => `${L(x)} (${tt.edge[selectedNode + '>' + x]})`) : EDGES[selectedNode].map(L);
  box.hidden = false;
  box.innerHTML = `<b>${tt.niNode(L(selectedNode))}</b><span>${tt.desc[selectedNode]}</span><span>${tt.niReads}: ${reads.length ? reads.map(f).join(' ') : tt.niNone}</span><span>${tt.niWrites}: ${writes.length ? writes.map(f).join(' ') : tt.niNone}</span><span>${tt.niOut}: ${outs.length ? outs.join(' / ') : tt.niEnd}${JOIN[selectedNode] ? ' · ' + tt.niJoin : ''}</span>`;
}
function renderStatic() {
  const tt = t();
  document.querySelectorAll('[data-t]').forEach(el => { const v = tt[el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
  document.getElementById('btnStep').textContent = tt.btnStep; document.getElementById('btnReset').textContent = tt.btnReset; document.getElementById('btnAuto').textContent = timer ? tt.btnStop : tt.btnAuto;
  const cls = { frontier: 'border-color:var(--accent);background:var(--accent-soft)', done: 'border-color:var(--done);background:var(--done-soft)', interrupt: 'border-color:var(--gate);background:var(--gate-soft);border-style:dashed', failed: 'border-color:var(--fail);background:var(--fail-soft)', retried: 'border-color:var(--fail);border-style:dashed' };
  document.getElementById('legend').innerHTML = tt.legend.map(([k, s]) => `<span><i style="${cls[k]}"></i>${s}</span>`).join('');
  document.getElementById('edgeLegend').innerHTML = tt.edgeLegend.map(s => `<span>${s}</span>`).join('');
  document.getElementById('glossary').innerHTML = tt.gloss.map(([b, p]) => `<div><b>${b}</b><p>${p}</p></div>`).join('');
  document.getElementById('purpose').innerHTML = tt.purpose.map(x => `<li>${x}</li>`).join('');
  document.getElementById('langJa').className = lang === 'ja' ? 'on' : ''; document.getElementById('langEn').className = lang === 'en' ? 'on' : '';
  document.documentElement.lang = lang;
}
function render() {
  const tt = t();
  renderStatic(); renderGraph(); renderNodeInfo(); renderNote(); renderLog();
  const f = document.getElementById('frontier'); f.innerHTML = [...S.frontier].map(n => { const ok = (JOIN[n] || []).every(d => S.done.has(d)); return `<span class="${ok ? '' : 'wait'}">${L(n)}${ok ? '' : ' ' + tt.waiting}</span>`; }).join('') || `<span style="color:var(--muted)">${tt.frontEmpty}</span>`;
  document.getElementById('state').innerHTML = Object.entries(S.state).map(([k, v]) => `<tr class="${S.changed.has(k) ? 'changed' : ''}"><td class="k">${tt.key[k] || k}${REDUCERS[k] ? `<span class="red">${tt.reducerTag}</span>` : ''}<small>${k}</small></td><td class="v">${V(v)}</td></tr>`).join('');
  document.getElementById('ckpt').textContent = JSON.stringify({ step: S.step, frontier: [...S.frontier], done: [...S.done], state: S.state }, null, 1);
  document.getElementById('concepts').innerHTML = tt.chips.map((x, i) => `<span class="chip ${[...concepts].some(c => T.ja.chips[i] === c || T.en.chips[i] === c) ? 'on' : ''}">${x}</span>`).join('');
  document.getElementById('btnStep').disabled = S.finished || !!S.paused || S.halted;
  document.getElementById('btnAuto').disabled = S.finished || !!S.paused || S.halted;
  const g = document.getElementById('gate');
  if (S.paused) {
    g.hidden = false; const names = S.paused.map(L).join('、');
    g.innerHTML = `<div class="gatebox"><b>${tt.gateTitle(names)}</b><small>${tt.gateSub}</small><div class="row"><input type="text" id="humanNote" placeholder="${tt.gatePh}" value="${tt.gateDefault}"><button class="primary" id="btnApprove">${tt.approve}</button><button id="btnReject">${tt.reject}</button></div></div>`;
    document.getElementById('btnApprove').onclick = () => { S.state = { ...S.state, human_note: document.getElementById('humanNote').value }; S.changed = new Set(['human_note']); S.paused = null; S.approvedOnce = true; log('✔ approved; human_note recorded', 'gate'); stepOnce(); };
    document.getElementById('btnReject').onclick = () => { log('✖ rejected; graph stays paused (fail closed)', 'gate'); note('reject', {}, [tt.chips[7]]); render(); };
  } else if (S.halted) {
    g.hidden = false; const names = [...S.failedNodes].map(L).join('、');
    g.innerHTML = `<div class="gatebox"><b>${tt.repairTitle(names)}</b><small>${tt.repairSub}</small><div class="row"><button class="primary" id="btnRepair">${tt.repair}</button></div></div>`;
    document.getElementById('btnRepair').onclick = () => { document.getElementById('optFailNode').value = ''; S.failLeft = {}; S.halted = false; S.failedNodes = new Set(); log('🔧 repaired; resuming from checkpoint', 'ok'); render(); stepOnce(); };
  } else g.hidden = true;
}

// ============================================================ controls
let timer = null;
function stopAuto() { if (timer) { clearInterval(timer); timer = null; } }
function reset() { S = initial(); LOG.length = 0; lastNote = null; concepts.clear(); selectedNode = null; stopAuto(); render(); }
document.getElementById('btnStep').onclick = stepOnce;
document.getElementById('btnReset').onclick = reset;
document.getElementById('btnAuto').onclick = () => { if (timer) { stopAuto(); render(); return; } timer = setInterval(() => { if (S.finished || S.paused || S.halted) { stopAuto(); render(); return; } stepOnce(); }, 900); render(); };
document.getElementById('langJa').onclick = () => { lang = 'ja'; try { localStorage.setItem('cgl-lang', 'ja'); } catch (e) {} render(); };
document.getElementById('langEn').onclick = () => { lang = 'en'; try { localStorage.setItem('cgl-lang', 'en'); } catch (e) {} render(); };
['optParallel','optInterruptRoux','optInterruptTaste','optFailNode','optFailTimes','optRetries'].forEach(id => document.getElementById(id).addEventListener('change', () => render()));
reset();
</script>
